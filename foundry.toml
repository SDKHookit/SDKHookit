# Hookit Plugin SDK: a standalone Foundry project. Same compiler settings as the Hookit monorepo.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
# script/Manifest.s.sol writes manifests/<name>.json; test/Manifest.t.sol reads examples/*.json
fs_permissions = [
    { access = "read-write", path = "./manifests" },
    { access = "read", path = "./examples" },
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
ink = "${INK_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false
